<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de precios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="img/logo calculadora.png" type="image/x-icon">
</head>
<body>

    <!-- NavBar -->
    <nav class="navbar navbar-expand-lg bg-danger-subtle">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="img/logo calculadora.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                Bootstrap
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="#">Features</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="#">Pricing</a>
                </li>
                <li class="nav-item">
                <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                </li>
            </ul>
            </div>
        </div>
    </nav>
    
    <!-- Main -->
    <main class="container">
        <h1 class="text-center mx-auto mt-4 fs-2">Calculadora de precios</h1>
        <p class="lead text-secondary text-center">Ingrese la información del producto para obtener los precio finales incluyendo descuentos, impuestos y envío</p>
        <!-- Formulario -->
        <form>
            <div class="form-group mt-2">
                <label for="nombre">Nombre del producto: </label>
                <input type="text" id="nombre" placeholder="camiseta" class="form-control">
            </div>

            <div class="form-group mt-2">
                <label for="precio">Precio unitario</label>
                <input type="number" id="precio" placeholder="12.00" min="0" step="0.01" class="form-control">
            </div>

            <div class="form-group mt-2">
                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" placeholder="5" min="0" step="1" class="form-control">
            </div>

            <div class="form-group mt-2">
                <label for="descuento">Porcentaje de descuento</label>
                <input type="number" id="descuento" min="0" max="100" class="form-control" placeholder="Máximo: 100%"> 
            </div>

            <div class="form-group mt-2">
                <label for="iva">¿Aplicar IVA?</label>
                <select id="iva" class="form-select">  
                    <option value="0">No</option>
                    <option value="1" selected>Sí</option>
                </select>
            </div>

            <div>
                <button class="btn btn-success mx-2 my-2" id="btnCalcular">
                    Calcular precio
                </button>
                <input type="reset" value="Limpiar" class="btn btn-danger mx-2 my-2">
            </div>
        </form>
        <div class="mt-4 d-none" id="resultado">
            <h2>Resultado</h2>

            <h3 class="mt-3 fs-5">Precio original: </h3>
            <p id="precioOriginal"></p>
            
            <h3 class="mt-3 fs-5">IVA: </h3>
            <p id="valorIVA"></p>

            <h3 class="mt-3 fs-5">Descuento: </h3>
            <p id="valorDescuento"></p>

            <h3 class="mt-3 fs-5">Precio final: </h3>
            <p id="precioFinal"></p>
        </div>


    </main>

    <!-- JavaScript de BootStrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <!-- JavaScript propio -->
     <script src="js/script.js"></script>
</body>
</html>
