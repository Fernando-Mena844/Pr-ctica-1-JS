<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <script>
        let a = 84; 
        let b = 30;
        let suma = a+b;
        console.log("suma " + suma);
        let resta = a-b;
        console.log("resta" + resta);
        let multi = a*b;
        console.log("multiplicacion "+ multi);
        let division = a/b;
        console.log("división" + division);
    </script>
</body>
</html>
