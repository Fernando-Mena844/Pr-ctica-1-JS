<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contenido</title>
</head>
<body>
    <p id="mensaje">Texto original</p>
    <button onclick="cambiarTexto()">Cambiar Texto</button>
    <script>
        function cambiarTexto(){
            document.getElementById("mensaje").innerText="Texto cambiado con JS."
        }
    </script>
</body>
</html>
